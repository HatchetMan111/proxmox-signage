<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Digital Signage – Login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
     background:linear-gradient(135deg,#1a1a2e,#16213e);
     color:#fff;min-height:100vh;display:flex;
     align-items:center;justify-content:center}
.login-box{background:#fff;color:#333;border-radius:12px;
           padding:2.5rem;width:380px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.login-box h1{font-size:1.3rem;margin-bottom:.3rem;color:#1a1a2e}
.login-box p{font-size:.85rem;color:#666;margin-bottom:1.5rem}
.login-box label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem;color:#444}
.login-box input[type="password"]{width:100%;padding:.7rem .9rem;border:2px solid #ddd;
  border-radius:8px;font-size:1rem;transition:border-color .2s}
.login-box input[type="password"]:focus{outline:none;border-color:#1a1a2e}
.login-box button{width:100%;padding:.75rem;background:linear-gradient(135deg,#1a1a2e,#16213e);
  color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;
  cursor:pointer;margin-top:1.2rem;transition:opacity .2s}
.login-box button:hover{opacity:.9}
.error{background:#fef2f2;color:#dc2626;padding:.7rem;border-radius:8px;
       font-size:.85rem;margin-bottom:1rem;text-align:center}
.logo{font-size:2.5rem;text-align:center;margin-bottom:.5rem}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🖼️</div>
  <h1>Digital Signage</h1>
  <p>Bitte mit Admin-Passwort anmelden</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password"
           placeholder="Passwort" autofocus>
    <button type="submit">Anmelden</button>
  </form>
</div>
</body>
</html>
